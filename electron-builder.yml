appId: com.promise-thens.agent-studio
productName: Agent Studio
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: agent-studio
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
  extendInfo:
    NSDocumentsFolderUsageDescription: Agent Studio 需要访问你选择的文稿目录，以便 Grok Runtime 在该工作区读写项目文件。
    NSDesktopFolderUsageDescription: Agent Studio 需要访问你选择的桌面目录，以便 Grok Runtime 在该工作区读写项目文件。
    NSDownloadsFolderUsageDescription: Agent Studio 需要访问你选择的下载目录，以便 Grok Runtime 在该工作区读写项目文件。
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
